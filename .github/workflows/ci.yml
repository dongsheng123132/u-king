# CI —— 每次 push/PR 自动跑的门禁：静态检查 + 前端类型/构建 + Rust 单元测试 + cargo check/clippy。
# 设计依据：测试金字塔最底层最便宜。CI runner 无沙箱 exe/无内网/无代理，
# 所以这里只跑"不依赖产物和外网"的部分（版本同步、源码防回退、前端 tsc/build、
# cargo test --lib、cargo check、clippy）。
# 完整的沙箱配置/余额实测/真装 Hermes 回归留给本地 `bash scripts/regression.sh`。
# 门禁清单、各 job 为什么区分平台、clippy 存量 warning 余额：见 docs/ci-gates.md。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 0. 泄漏闸门（P0：敏感信息不进公开仓）──
      - name: 泄漏闸门
        run: node scripts/check-leak.mjs .

      # ── 1. 版本号四处同步 ──
      - name: 版本号四处一致
        run: |
          v_ts=$(grep -oE 'APP_VERSION = "[^"]+"' src/version.ts | grep -oE '[0-9.]+')
          v_pkg=$(node -p "require('./package.json').version")
          v_tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          v_cargo=$(grep -oE '^version = "[^"]+"' src-tauri/Cargo.toml | grep -oE '[0-9.]+')
          echo "version.ts=$v_ts package.json=$v_pkg tauri.conf=$v_tauri Cargo.toml=$v_cargo"
          if [ "$v_ts" = "$v_pkg" ] && [ "$v_pkg" = "$v_tauri" ] && [ "$v_tauri" = "$v_cargo" ]; then
            echo "✓ 四处一致 ($v_ts)"
          else
            echo "✗ 版本号不一致 — 发版前四处必须同步"; exit 1
          fi

      # ── 2. 已修 bug 防回退（源码断言）──
      - name: 关键修复未回退
        run: |
          set -e
          grep -q 'hard \* 500_000' src-tauri/src/providers.rs \
            || { echo "✗ 双重扣减修复被回退(providers.rs)"; exit 1; }
          echo "✓ 双重扣减修复在"
          grep -q 'persist_python_scripts_path' src-tauri/src/installer.rs \
            || { echo "✗ Hermes PATH 持久化修复丢失(installer.rs)"; exit 1; }
          echo "✓ Hermes PATH 修复在"
          grep -q 'u-claw.org.cn/uking/version.json' src-tauri/src/installer.rs \
            || { echo "✗ version 首选源不是 cn 镜像"; exit 1; }
          echo "✓ version 首选源是 cn 镜像"
          # providers.rs 不能有裸 api.u-claw.org（注释/说明行除外）
          if grep -nE 'https://api\.u-claw\.org/' src-tauri/src/providers.rs \
             | grep -v '\.org\.cn' | grep -vE '^[[:space:]]*//|⚠️|裸|GFW|实测'; then
            echo "✗ providers.rs 仍有裸 api.u-claw.org(国内被墙)"; exit 1
          fi
          echo "✓ providers.rs 全 cn 镜像"

  # 前端门禁：README「提交改动前三道闸门」里的 pnpm build 从 2026-11-02 起真的进 CI。
  # 单独成 job 是为了和 rust 并行（前端 1~2 分钟），失败时日志也干净。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 与 rust job 同一装法（pnpm 9 + frozen lockfile），
      # 防 lockfile 与 package.json 漂移；兼容 pnpm@9 的 lockfileVersion 9.0。
      - name: 装前端依赖（lockfile 冻结）
        run: |
          npm install --global pnpm@9
          pnpm install --frozen-lockfile
      # 单独跑一次 tsc：类型错误在日志里单独成段（pnpm build 里也含 tsc，两步都要求过）。
      - name: 类型检查（tsc --noEmit）
        run: pnpm exec tsc --noEmit
      # pnpm build = 一串静态自检（模块耦合/主题/i18n/技能包/模型目录…）+ tsc + vite build + webkit 兼容。
      - name: 前端构建（pnpm build）
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tauri 在 Linux 需要的系统依赖
      - name: 装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 影核生成文件没有漂移
        run: |
          npm install --global pnpm@9
          pnpm install --frozen-lockfile
          pnpm run action-parity:check
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      # 曾经是 `cargo clippy -- -D warnings || cargo clippy`：有 warning 时第二条兜底，
      # 于是永远绿。现在没有兜底、没有 --cap-lints、没有 continue-on-error：
      # clippy warning 就是 CI 失败。存量 warning 清单与清账计划见 docs/ci-gates.md。
      - name: clippy（warning 即失败）
        working-directory: src-tauri
        continue-on-error: false
        run: cargo clippy --all-targets -- -D warnings

  # Rust 单元测试（614 条 #[test]，全部在 lib 里；仓库无独立 tests/ 目录）。
  # 放 windows-latest 而不是 ubuntu：这批测试写的是 Windows 语义——
  # `discover_tools_from` 非 Windows 只找无扩展名文件、`unwrap_shim` 解 `.cmd`、
  # 用例里直接写 `%APPDATA%\npm` / `C:\Users\...`。同一个 HEAD 在本机 macOS 上
  # 561 passed / 9 failed（9 条全是上述 Windows 语义），在 Windows 才有意义。
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 605 条真跑；只跳过 `run_shell_chinese_output_not_mojibake` 一条——
      # 它断言中文 Windows（ACP=936）下 `cmd /C "chcp 65001 >nul & echo 中文测试OK"` 的输出，
      # 而 GitHub 的 Windows runner 是 en-US（ACP=437）：cmd 在写管道**之前**就把中文变成 "?"，
      # 我们的解码器还没轮到。这是 runner locale 差异，不是产品回归；开发机（中文 Windows）
      # 仍要跑这条，别把它从测试里删掉。
      - name: cargo test --lib（跳过 1 条 locale 依赖用例）
        working-directory: src-tauri
        run: cargo test --lib -- --skip run_shell_chinese_output_not_mojibake

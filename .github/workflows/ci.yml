# CI —— 每次 push/PR 自动跑的门禁：静态检查 + 前端类型/构建 + Rust 单元测试 + cargo check/clippy。
# 设计依据：测试金字塔最底层最便宜。CI runner 无沙箱 exe/无内网/无代理，
# 所以这里只跑"不依赖产物和外网"的部分（版本同步、源码防回退、前端 tsc/build、
# cargo test --lib、cargo check、clippy）。
# 完整的沙箱配置/余额实测/真装 Hermes 回归留给本地 `bash scripts/regression.sh`。
# 门禁清单、各 job 为什么区分平台、clippy 存量 warning 余额：见 docs/ci-gates.md。
# clippy 这一步仍是「只报错误、不卡 warning」的老写法：存量 334 条 warning 一次清零不现实，
# 改成严格失败会让 main 长红。收口方案见 docs/ci-gates.md「clippy 为什么还没上闸」。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 0. 泄漏闸门（P0：敏感信息不进公开仓）──
      - name: 泄漏闸门
        run: node scripts/check-leak.mjs .

      # ── 1. 版本号四处同步 ──
      - name: 版本号四处一致
        run: |
          v_ts=$(grep -oE 'APP_VERSION = "[^"]+"' src/version.ts | grep -oE '[0-9.]+')
          v_pkg=$(node -p "require('./package.json').version")
          v_tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          v_cargo=$(grep -oE '^version = "[^"]+"' src-tauri/Cargo.toml | grep -oE '[0-9.]+')
          echo "version.ts=$v_ts package.json=$v_pkg tauri.conf=$v_tauri Cargo.toml=$v_cargo"
          if [ "$v_ts" = "$v_pkg" ] && [ "$v_pkg" = "$v_tauri" ] && [ "$v_tauri" = "$v_cargo" ]; then
            echo "✓ 四处一致 ($v_ts)"
          else
            echo "✗ 版本号不一致 — 发版前四处必须同步"; exit 1
          fi

      # ── 2. 已修 bug 防回退（源码断言）──
      - name: 关键修复未回退
        run: |
          set -e
          grep -q 'hard \* 500_000' src-tauri/src/providers.rs \
            || { echo "✗ 双重扣减修复被回退(providers.rs)"; exit 1; }
          echo "✓ 双重扣减修复在"
          grep -q 'persist_python_scripts_path' src-tauri/src/installer.rs \
            || { echo "✗ Hermes PATH 持久化修复丢失(installer.rs)"; exit 1; }
          echo "✓ Hermes PATH 修复在"
          grep -q 'u-claw.org.cn/uking/version.json' src-tauri/src/installer.rs \
            || { echo "✗ version 首选源不是 cn 镜像"; exit 1; }
          echo "✓ version 首选源是 cn 镜像"
          # providers.rs 不能有裸 api.u-claw.org（注释/说明行除外）
          if grep -nE 'https://api\.u-claw\.org/' src-tauri/src/providers.rs \
             | grep -v '\.org\.cn' | grep -vE '^[[:space:]]*//|⚠️|裸|GFW|实测'; then
            echo "✗ providers.rs 仍有裸 api.u-claw.org(国内被墙)"; exit 1
          fi
          echo "✓ providers.rs 全 cn 镜像"

  # 前端门禁：README「提交改动前三道闸门」里的 pnpm build 从 2026-11-02 起真的进 CI。
  # 单独成 job 是为了和 rust 并行（前端 1~2 分钟），失败时日志也干净。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 与 rust job 同一装法（pnpm 9 + frozen lockfile），
      # 防 lockfile 与 package.json 漂移；兼容 pnpm@9 的 lockfileVersion 9.0。
      - name: 装前端依赖（lockfile 冻结）
        run: |
          npm install --global pnpm@9
          pnpm install --frozen-lockfile
      # 单独跑一次 tsc：类型错误在日志里单独成段（pnpm build 里也含 tsc，两步都要求过）。
      - name: 类型检查（tsc --noEmit）
        run: pnpm exec tsc --noEmit
      # pnpm build = 一串静态自检（模块耦合/主题/i18n/技能包/模型目录…）+ tsc + vite build + webkit 兼容。
      - name: 前端构建（pnpm build）
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tauri 在 Linux 需要的系统依赖
      - name: 装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 影核生成文件没有漂移
        run: |
          npm install --global pnpm@9
          pnpm install --frozen-lockfile
          pnpm run action-parity:check
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      # 保持原样（只报错误，不卡 warning）：存量 334 条 clippy warning（lib 171 + lib test 163）
      # 一天清不掉，直接 `-D warnings` 会让 main 长红。真正的收紧在下面的 `clippy-baseline`
      # job（冻结存量、禁止新增），存量清完后这个 job 的 clippy 步骤与本 job 一起收口。
      - name: clippy（只报错误，不卡 warning）
        working-directory: src-tauri
        run: cargo clippy -- -D warnings || cargo clippy

  # clippy 收口第一阶段：baseline 冻结 —— 存量放行、**新增即失败**。
  # 为什么不是直接 `cargo clippy --all-targets -- -D warnings`：存量 334 条一次清不掉，
  # 硬卡会让 main 长红（这就是上一版被撤回的原因）。这里把存量截图冻结进 clippy-baseline.json，
  # 只断言「不许比 baseline 多」，存量在 B1~B3 的清理 PR 里一路往下掉。
  # 硬截止 2026-12-31：存量归零（B4）后撤掉本 job 与 baseline 文件，换回 `-D warnings`。
  # 指纹 = lint 名 + 相对路径 + item 名（**不含行号**）；清理顺序、allow 上限见 docs/ci-gates.md。
  clippy-baseline:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— verify-shrink 要 `git show <base>:clippy-baseline.json` 读旧账本。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # baseline 只允许变小：拿 base 分支上的旧账本按 JSON 语义比，
      # 出现「新增条目 / 计数上涨 / 总数上涨」直接失败。
      # 这等价于「git diff 里 clippy-baseline.json 只能有删除行」，但不会被重排或格式化绕过。
      - name: baseline 只减不增（对比 base 分支）
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -eu
          base="${PR_BASE:-${{ github.event.repository.default_branch }}}"
          git rev-parse --verify -q "origin/$base" >/dev/null || git fetch --no-tags --depth=50 origin "$base"
          echo "base = origin/$base"
          node scripts/clippy-baseline.mjs verify-shrink --base-ref "origin/$base"
      # 不加 `-D warnings`：有 warning 时退出码仍是 0，所以这一步失败=真编译错误，
      # 与「warning 质量」分开归因。诊断全量落 JSON，供下一步比对与失败留档。
      - name: cargo clippy（全目标，JSON 留证）
        working-directory: src-tauri
        run: cargo clippy --all-targets --message-format=json > ../clippy.json
      - name: baseline 门禁（新增即失败，存量放行）
        run: node scripts/clippy-baseline.mjs check --input clippy.json
      # 红了要能直接拿到全量诊断，不用重跑。保留 14 天。
      - name: 失败时留存诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-json
          path: clippy.json
          retention-days: 14

  # Rust 单元测试（614 条 #[test]，全部在 lib 里；仓库无独立 tests/ 目录）。
  # 放 windows-latest 而不是 ubuntu：这批测试写的是 Windows 语义——
  # `discover_tools_from` 非 Windows 只找无扩展名文件、`unwrap_shim` 解 `.cmd`、
  # 用例里直接写 `%APPDATA%\npm` / `C:\Users\...`。同一个 HEAD 在本机 macOS 上
  # 561 passed / 9 failed（9 条全是上述 Windows 语义），在 Windows 才有意义。
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 605 条真跑；只跳过 `run_shell_chinese_output_not_mojibake` 一条——
      # 它断言中文 Windows（ACP=936）下 `cmd /C "chcp 65001 >nul & echo 中文测试OK"` 的输出，
      # 而 GitHub 的 Windows runner 是 en-US（ACP=437）：cmd 在写管道**之前**就把中文变成 "?"，
      # 我们的解码器还没轮到。这是 runner locale 差异，不是产品回归；开发机（中文 Windows）
      # 仍要跑这条，别把它从测试里删掉。
      - name: cargo test --lib（跳过 1 条 locale 依赖用例）
        working-directory: src-tauri
        run: cargo test --lib -- --skip run_shell_chinese_output_not_mojibake
